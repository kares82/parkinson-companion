apply plugin: 'com.android.application'

/* ---- the version, and the key that signs it ------------------------------
   Both come from the environment when there is one, and fall back to something
   that builds locally when there is not. Both are computed HERE, as plain
   locals, rather than inline in the blocks below — each for a reason that cost
   a build:

   versionCode was written inline as `versionCode (getenv(..) ?: "1") as
   Integer`. Groovy parses that as `(versionCode(...)) as Integer`: the cast
   lands on the call's RESULT, the setter is handed a String, and the build
   dies at configuration time with "Value is null" and a line number that looks
   like a typo.

   Play refuses a versionCode it has already accepted and remembers them for
   the life of the app, so the number is never chosen by hand: CI passes its
   run number, which only ever increases.

   The signing block only exists when PC_KEYSTORE points at a real file. A
   release build without it is unsigned — a perfectly good way to prove the
   project compiles, and an impossible way to ship. Gradle fails at
   configuration time on a missing file, so the check is before the block and
   not inside it. */
def pcVersionCode = (System.getenv("PC_VERSION_CODE") ?: "1") as Integer
def pcKeystore = System.getenv("PC_KEYSTORE")
def pcSigned = pcKeystore != null && !pcKeystore.isEmpty() && file(pcKeystore).exists()

android {
    namespace = "net.redtriangle.parkinson"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "net.redtriangle.parkinson"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode pcVersionCode
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    if (pcSigned) {
        signingConfigs {
            release {
                storeFile file(pcKeystore)
                storePassword System.getenv("PC_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PC_KEY_ALIAS")
                keyPassword System.getenv("PC_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (pcSigned) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
