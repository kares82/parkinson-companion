name: Android — build TWA & upload to Play

# Manual only, and defaults to the internal testing track. Nothing reaches the
# public without a deliberate choice here plus a promotion in Play Console.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to"
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      dry_run:
        description: "Validate only — upload nothing"
        type: boolean
        default: false

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the store listing is out of sync
        run: python3 tools/sync-store-metadata.py --check

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.2', bundler-cache: false }

      - name: Install tooling
        run: |
          npm i -g @bubblewrap/cli
          gem install fastlane --no-document

      - name: Point Bubblewrap at the runner's JDK and Android SDK
        # Without this it downloads its own ~1GB toolchain on every run.
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" \
            > ~/.bubblewrap/config.json

      - name: Restore the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See store/CI.md."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android.keystore
          echo "keystore restored ($(stat -c%s android.keystore) bytes)"

      - name: Build the TWA
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cp store/twa-manifest.json ./twa-manifest.json
          bubblewrap build --skipPwaValidation
          ls -la app-release-bundle.aab

      - name: Write the Play service-account key
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set. See store/CI.md."
            exit 1
          fi
          printf '%s' "$PLAY_JSON" > play-key.json
          python3 -c "import json;json.load(open('play-key.json'))" || {
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not valid JSON"; exit 1; }

      - name: Upload to Play
        env:
          PLAY_JSON_KEY_PATH: play-key.json
        run: |
          fastlane android upload \
            track:"${{ inputs.track }}" \
            dry_run:"${{ inputs.dry_run }}"

      - name: Shred credentials
        if: always()
        run: shred -u play-key.json android.keystore 2>/dev/null || rm -f play-key.json android.keystore

      - name: Keep the build for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            app-release-bundle.aab
            app-release-signed.apk
          if-no-files-found: warn
          retention-days: 14
